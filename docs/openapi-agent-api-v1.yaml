openapi: 3.1.0
info:
  title: FairPay Agent API
  version: 1.0.0
  description: |
    Internal-only Agent API for FairPay Phase 1A. Enables AI-driven group expense
    creation through a preview → confirm → commit flow with strict server-side
    immutability, single-use confirmations, and idempotent commits.

    All money is integer VND. `member_id` always refers to `group_members.id`,
    never to `profiles.id`. Actor identity is read from the Supabase JWT —
    `actor_user_id` is never accepted in any request body.

servers:
  - url: https://{project}.supabase.co/functions/v1/fairpay-agent-api
    variables:
      project:
        default: your-project
    description: Deployed Edge Function transport. Logical paths below begin with /v1/.

security:
  - bearerAuth: []

paths:
  /v1/me:
    get:
      summary: Get authenticated user profile.
      tags: [Read]
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/groups:
    get:
      summary: List the actor's non-archived groups.
      tags: [Read]
      responses:
        '200':
          description: Groups
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupsResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/groups/{group_id}/members:
    get:
      summary: List registered members of a group.
      tags: [Read]
      parameters:
        - in: path
          name: group_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Members
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupMembersResponse' }
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/expense-duplicate-checks:
    post:
      summary: Check for likely duplicate expenses.
      tags: [Search]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DuplicateCheckRequest' }
      responses:
        '200':
          description: Matches
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DuplicateCheckResponse' }
        '422':
          $ref: '#/components/responses/Unprocessable'

  /v1/expenses/preview:
    post:
      summary: Compute and store an immutable expense preview.
      description: |
        Validates the proposed expense, runs split allocation, performs a
        duplicate-check pass, and stores an immutable canonical preview
        server-side. Returns the preview id, hash, and the rendered preview
        for display. The model never sees the canonical preview hash logic.
      tags: [Write]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PreviewRequest' }
      responses:
        '200':
          description: Preview created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PreviewResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429':
          description: Preview creation rate limit exceeded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/previews/{preview_id}/confirm:
    post:
      summary: '[UI ONLY] Bind actor to preview with a one-time confirmation.'
      description: |
        Called only by the FairPay UI confirmation click handler — never by the
        AI model. Creates a one-time confirmation linking the actor to the
        preview hash. UI must call this before commit.
      tags: [UI-only]
      parameters:
        - in: path
          name: preview_id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfirmRequest' }
      responses:
        '200':
          description: Confirmation created (or replayed if idempotent)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfirmResponse' }
        '403':
          description: Preview not owned by actor
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Preview already consumed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '410':
          description: Preview expired
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/expenses/commit:
    post:
      summary: '[UI ONLY] Atomically commit a confirmed preview.'
      description: |
        Called only by the FairPay UI controller — never by the AI model.
        Body MUST contain ONLY preview_id, preview_hash, confirmation_id;
        unknown fields are rejected. Idempotency-Key header is required.
        Idempotent: retries with the same key replay the original response.
      tags: [UI-only]
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string }
          description: Per-user unique key for retry-safe commits.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommitRequest' }
      responses:
        '200':
          description: Expense committed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommitResponse' }
        '400':
          description: Missing Idempotency-Key
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Duplicate or already-consumed preview/confirmation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '410':
          description: Preview expired
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/operations/{preview_id}:
    get:
      summary: Poll the status of an agent operation.
      tags: [Read]
      parameters:
        - in: path
          name: preview_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Operation status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperationResponse' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Unauthorized:
      description: Missing or invalid Authorization header.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Actor lacks permission for this resource.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unprocessable:
      description: Request validation failed.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Uuid:
      type: string
      format: uuid

    IntegerVnd:
      type: integer
      minimum: 0
      maximum: 9999999999
      description: Integer VND amount (no decimals).

    PositiveIntegerVnd:
      type: integer
      minimum: 1
      maximum: 9999999999

    SplitMethod:
      type: string
      enum: [equal, exact, fixed_then_equal_remainder]

    Currency:
      type: string
      enum: [VND]

    DateString:
      type: string
      pattern: '^\d{4}-\d{2}-\d{2}$'
      example: '2026-06-22'

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details: {}

    MeResponse:
      type: object
      required: [user]
      properties:
        user:
          type: object
          required: [id, email, full_name, avatar_url]
          properties:
            id: { $ref: '#/components/schemas/Uuid' }
            email: { type: string, format: email }
            full_name: { type: string }
            avatar_url: { type: string, nullable: true }

    GroupSummary:
      type: object
      required: [id, name, description, is_archived, member_count, member_role]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string }
        description: { type: string, nullable: true }
        is_archived: { type: boolean }
        member_count: { type: integer, minimum: 0 }
        member_role: { type: string, enum: [admin, member] }

    GroupsResponse:
      type: object
      required: [groups]
      properties:
        groups:
          type: array
          items: { $ref: '#/components/schemas/GroupSummary' }

    GroupMember:
      type: object
      required: [member_id, user_id, role, full_name, email, avatar_url]
      properties:
        member_id:
          $ref: '#/components/schemas/Uuid'
          description: group_members.id (always — never profiles.id).
        user_id: { $ref: '#/components/schemas/Uuid' }
        role: { type: string, enum: [admin, member] }
        full_name: { type: string }
        email: { type: string, nullable: true }
        avatar_url: { type: string, nullable: true }

    GroupMembersResponse:
      type: object
      required: [group_id, members]
      properties:
        group_id: { $ref: '#/components/schemas/Uuid' }
        members:
          type: array
          items: { $ref: '#/components/schemas/GroupMember' }

    DuplicateCheckRequest:
      type: object
      additionalProperties: false
      required: [group_id, description, amount, payer_member_id]
      properties:
        group_id: { $ref: '#/components/schemas/Uuid' }
        description: { type: string, minLength: 1, maxLength: 200 }
        amount: { $ref: '#/components/schemas/PositiveIntegerVnd' }
        payer_member_id: { $ref: '#/components/schemas/Uuid' }
        expense_date: { $ref: '#/components/schemas/DateString' }
        window_hours: { type: integer, minimum: 1, maximum: 168 }

    DuplicateMatch:
      type: object
      required: [expense_id, match_type, reason, description, amount, expense_date, created_at]
      properties:
        expense_id: { $ref: '#/components/schemas/Uuid' }
        match_type: { type: string, enum: [strong, likely] }
        reason: { type: string }
        description: { type: string }
        amount: { $ref: '#/components/schemas/IntegerVnd' }
        expense_date: { $ref: '#/components/schemas/DateString' }
        created_at: { type: string, format: date-time }

    DuplicateCheckResponse:
      type: object
      required: [matches]
      properties:
        matches:
          type: array
          items: { $ref: '#/components/schemas/DuplicateMatch' }

    PreviewParticipant:
      type: object
      additionalProperties: false
      required: [member_id]
      properties:
        member_id: { $ref: '#/components/schemas/Uuid' }
        amount: { $ref: '#/components/schemas/PositiveIntegerVnd' }
        fixed_amount: { $ref: '#/components/schemas/PositiveIntegerVnd' }

    PreviewRequest:
      type: object
      additionalProperties: false
      required: [group_id, description, amount, payer_member_id, split_method, participants]
      properties:
        group_id: { $ref: '#/components/schemas/Uuid' }
        description: { type: string, minLength: 1, maxLength: 200 }
        amount: { $ref: '#/components/schemas/PositiveIntegerVnd' }
        currency: { $ref: '#/components/schemas/Currency' }
        category:
          type: string
          enum: [Food & Drink, Transportation, Accommodation, Entertainment, Shopping, Utilities, Healthcare, Education, Other]
        expense_date: { $ref: '#/components/schemas/DateString' }
        comment: { type: string, maxLength: 1000, nullable: true }
        payer_member_id: { $ref: '#/components/schemas/Uuid' }
        split_method: { $ref: '#/components/schemas/SplitMethod' }
        participants:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: '#/components/schemas/PreviewParticipant' }

    PreviewSplit:
      type: object
      required: [member_id, user_id, full_name, amount]
      properties:
        member_id: { $ref: '#/components/schemas/Uuid' }
        user_id: { $ref: '#/components/schemas/Uuid' }
        full_name: { type: string }
        amount: { $ref: '#/components/schemas/PositiveIntegerVnd' }

    PreviewResponse:
      type: object
      required: [preview_id, preview_hash, operation_id, expires_at, preview, duplicate_warnings]
      properties:
        preview_id: { $ref: '#/components/schemas/Uuid' }
        preview_hash: { type: string, pattern: '^[0-9a-f]{64}$' }
        operation_id: { $ref: '#/components/schemas/Uuid' }
        expires_at: { type: string, format: date-time }
        preview:
          type: object
          required:
            - group_id
            - group_name
            - description
            - amount
            - currency
            - expense_date
            - payer
            - requested_split_method
            - splits
            - total_check
          properties:
            group_id: { $ref: '#/components/schemas/Uuid' }
            group_name: { type: string }
            description: { type: string }
            amount: { $ref: '#/components/schemas/IntegerVnd' }
            currency: { $ref: '#/components/schemas/Currency' }
            category: { type: string, nullable: true }
            expense_date: { $ref: '#/components/schemas/DateString' }
            comment: { type: string, nullable: true }
            payer:
              type: object
              required: [member_id, user_id, full_name]
              properties:
                member_id: { $ref: '#/components/schemas/Uuid' }
                user_id: { $ref: '#/components/schemas/Uuid' }
                full_name: { type: string }
            requested_split_method: { $ref: '#/components/schemas/SplitMethod' }
            splits:
              type: array
              items: { $ref: '#/components/schemas/PreviewSplit' }
            total_check: { $ref: '#/components/schemas/IntegerVnd' }
        duplicate_warnings:
          type: array
          items: { $ref: '#/components/schemas/DuplicateMatch' }

    ConfirmRequest:
      type: object
      additionalProperties: false
      required: [preview_hash]
      properties:
        preview_hash: { type: string, pattern: '^[0-9a-f]{64}$' }

    ConfirmResponse:
      type: object
      required: [confirmation_id, preview_id, preview_hash, expires_at]
      properties:
        confirmation_id: { $ref: '#/components/schemas/Uuid' }
        preview_id: { $ref: '#/components/schemas/Uuid' }
        preview_hash: { type: string, pattern: '^[0-9a-f]{64}$' }
        expires_at: { type: string, format: date-time }

    CommitRequest:
      type: object
      additionalProperties: false
      required: [preview_id, preview_hash, confirmation_id]
      properties:
        preview_id: { $ref: '#/components/schemas/Uuid' }
        preview_hash: { type: string, pattern: '^[0-9a-f]{64}$' }
        confirmation_id: { $ref: '#/components/schemas/Uuid' }

    CommitResponse:
      type: object
      required: [success, expense_id, preview_id, operation_id, total_amount, currency, splits_count]
      properties:
        success: { type: boolean, enum: [true] }
        expense_id: { $ref: '#/components/schemas/Uuid' }
        preview_id: { $ref: '#/components/schemas/Uuid' }
        operation_id: { $ref: '#/components/schemas/Uuid' }
        total_amount: { $ref: '#/components/schemas/IntegerVnd' }
        currency: { $ref: '#/components/schemas/Currency' }
        splits_count: { type: integer, minimum: 1 }

    OperationStatus:
      type: string
      enum: [pending, previewed, confirmed, committed, failed, expired]

    OperationResponse:
      type: object
      required: [operation_id, preview_id, status, result, error, created_at, updated_at]
      properties:
        operation_id: { $ref: '#/components/schemas/Uuid' }
        preview_id: { type: string, format: uuid, nullable: true }
        status: { $ref: '#/components/schemas/OperationStatus' }
        result: { nullable: true }
        error: { nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
