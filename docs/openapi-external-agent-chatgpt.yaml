openapi: 3.1.0
info:
  title: FairPay External Agent API
  version: 1.0.0
  description: |
    Public no-key API for external AI agents (ChatGPT, Claude, etc.) to submit
    shared expense proposals to FairPay.

    **No API key or authentication is required.**

    Agents submit proposals only. Real expenses are created only after a
    signed-in FairPay user approves the proposal inside the app.

    ## Required flow
    1. `GET /api/external-agent/context` — read capabilities, schemas, and examples.
    2. Parse the user's natural-language input into a structured proposal.
    3. `POST /api/external-agent-submissions` — submit the proposal.
    4. Done — the FairPay user reviews and approves inside the website.

    ## Probe mode
    Sending an empty body or `{}` to `POST /api/external-agent-submissions`
    returns the same capability document as `GET /api/external-agent/context`.

servers:
  - url: https://long-pay.vercel.app
    description: FairPay production (Vercel)

paths:
  /api/health:
    get:
      operationId: getHealth
      summary: Check that the FairPay domain is reachable.
      tags: [Utility]
      security: []
      responses:
        '200':
          description: Domain is reachable.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  service: { type: string, example: FairPay }

  /api/external-agent/context:
    get:
      operationId: getAgentContext
      summary: Get the capability and onboarding document for this API.
      description: |
        Returns a machine-readable document that describes all available
        endpoints, request schemas, split-method rules, examples, error codes,
        and DNS/network troubleshooting guidance.

        Call this first so you understand the required flow before submitting.
      tags: [Discovery]
      security: []
      responses:
        '200':
          description: Capability document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentContextDocument'

  /api/external-agent-submissions:
    post:
      operationId: submitExpenseProposal
      summary: Submit an expense proposal for a FairPay user to review.
      description: |
        Submit a structured expense proposal. The proposal is queued; a FairPay
        user or group admin must approve it before any real expense is created.

        **Probe mode**: sending an empty body or `{}` returns the capability
        document (same as `GET /api/external-agent/context`) so agents can
        self-orient without a separate request.
      tags: [Submissions]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalAgentSubmissionRequest'
            examples:
              two_person_split:
                summary: Two-person equal split, target user paid
                value:
                  target_email: user@example.com
                  group_name: Core
                  source: chatgpt
                  description: Cà phê
                  amount: 50000
                  currency: VND
                  category: Food & Drink
                  payer:
                    email: user@example.com
                  split_method: equal
                  participants:
                    - email: user@example.com
                    - display_name: Anh Tâm
              group_subset:
                summary: Specific group members by name
                value:
                  target_email: user@example.com
                  group_name: Core
                  source: chatgpt
                  description: Massage
                  amount: 500000
                  currency: VND
                  category: Other
                  payer:
                    email: user@example.com
                  split_method: equal
                  participants:
                    - display_name: Anh Tâm
                    - email: user@example.com
                    - display_name: Thuần
      responses:
        '201':
          description: Proposal queued successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionResponse'
        '200':
          description: Probe response — capability document returned for empty/bare-object body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentContextDocument'
        '422':
          description: Validation error — request body failed schema checks.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded — retry after ~60 seconds.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Too many pending proposals for this target user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Transport/DNS error reaching the FairPay backend.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    ActorRef:
      type: object
      description: |
        Reference to a person. Provide `email` when known; otherwise `display_name`.
        At least one is required.
      properties:
        email:
          type: string
          format: email
          description: FairPay account email (preferred — unambiguous).
        display_name:
          type: string
          maxLength: 200
          description: Person's display name. FairPay resolves it at approval time.
      minProperties: 1

    Participant:
      allOf:
        - $ref: '#/components/schemas/ActorRef'
        - type: object
          properties:
            amount:
              type: integer
              description: Per-person amount in integer VND. Required for `exact` split.
            fixed_amount:
              type: integer
              description: Fixed portion in integer VND. Used with `fixed_then_equal_remainder`.

    ExternalAgentSubmissionRequest:
      type: object
      required: [target_email, description, amount, currency, payer, split_method, participants]
      properties:
        target_email:
          type: string
          format: email
          description: FairPay account email of the user who should review this proposal.
        group_id:
          type: string
          format: uuid
          description: Stable group UUID (optional — use group_name if you don't have it).
        group_name:
          type: string
          maxLength: 200
          description: Human-readable group name, e.g. "Core". Required if group_id is omitted.
        source:
          type: string
          maxLength: 100
          description: Identifier for your agent, e.g. "chatgpt".
        description:
          type: string
          minLength: 1
          maxLength: 200
          description: Expense description.
        amount:
          type: integer
          minimum: 1
          maximum: 9999999999
          description: |
            Total amount in integer VND (no decimals).
            Convert "50k" → 50000, "600 nghìn" → 600000.
        currency:
          type: string
          enum: [VND]
          description: Only VND is supported.
        category:
          type: string
          enum:
            - Food & Drink
            - Transportation
            - Accommodation
            - Entertainment
            - Shopping
            - Utilities
            - Healthcare
            - Education
            - Other
        expense_date:
          type: string
          format: date
          description: YYYY-MM-DD. Defaults to today.
        comment:
          type: string
          nullable: true
          maxLength: 1000
        payer:
          $ref: '#/components/schemas/ActorRef'
        split_method:
          type: string
          enum: [equal, exact, fixed_then_equal_remainder]
          description: |
            - `equal`: divide evenly; do NOT include amount/fixed_amount on participants.
            - `exact`: every participant must have `amount`; sum must equal total.
            - `fixed_then_equal_remainder`: some participants have `fixed_amount`; others share the rest equally.
        participants:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/Participant'

    SubmissionResponse:
      type: object
      properties:
        trace_id:
          type: string
          format: uuid
          description: Request trace ID for debugging.
        submission_id:
          type: string
          format: uuid
          description: Stable ID for this proposal.
        status:
          type: string
          example: pending
        expires_at:
          type: string
          format: date-time
        message:
          type: string
          example: Submission queued for FairPay approval

    AgentContextDocument:
      type: object
      description: Machine-readable capability and onboarding document.
      properties:
        trace_id:
          type: string
          format: uuid
        service:
          type: string
          example: FairPay
        version:
          type: string
          example: v1
        base_url:
          type: string
          example: https://long-pay.vercel.app
        purpose:
          type: string
        required_flow:
          type: array
          items: { type: string }
        available_apis:
          type: object
          additionalProperties: { type: string }
        request_shape:
          type: object
          additionalProperties: { type: string }
        validation_rules:
          type: object
          additionalProperties: { type: string }
        split_method_rules:
          type: object
          additionalProperties: { type: string }
        categories:
          type: array
          items: { type: string }
        resolution_note:
          type: string
        examples:
          type: object
        common_errors:
          type: object
          additionalProperties: { type: string }
        agent_instructions:
          type: array
          items: { type: string }
        network_diagnostics:
          type: object

    ErrorResponse:
      type: object
      properties:
        trace_id:
          type: string
          format: uuid
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Machine-readable error code.
              examples:
                - VALIDATION_ERROR
                - RATE_LIMIT_EXCEEDED
                - PENDING_LIMIT_EXCEEDED
                - FAIRPAY_HOST_UNRESOLVED
                - SUBMISSION_FAILED
            message:
              type: string
            details:
              description: Per-field validation issues when code is VALIDATION_ERROR.
